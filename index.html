<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mahjong"><meta name="theme-color" content="#0a2f5c">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;font-family:Georgia,'Times New Roman',serif;background:#0a2f5c;color:#fff}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.scr.on{display:flex}
#game,#levels{background:radial-gradient(circle at 50% 30%,#2a78c4,#0a2f5c 75%)}
#home{background:repeating-linear-gradient(90deg,transparent 0 58px,#2a5d94 58px 62px),repeating-linear-gradient(0deg,transparent 0 78px,#2a5d94 78px 82px),linear-gradient(#d6ecff,#8fc3f0);justify-content:center;gap:18px}
h1{font-size:44px;margin:0;color:#ffffff;text-shadow:0 3px 0 #0d3b73,0 6px 10px rgba(0,0,0,.4);text-align:center;line-height:1}
.sub{color:#2a5d94;font-style:italic;margin:0 0 20px;font-size:17px;text-align:center;padding:0 24px}
.big{background:linear-gradient(#ff9a3c,#e8641a);border:3px solid #ffd9a0;color:#fff;font:700 28px Georgia,serif;padding:14px 56px;border-radius:40px;box-shadow:0 5px 0 #a24410,0 10px 18px rgba(0,0,0,.35)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a24410}
.mid{background:#1f4f8f;border:2px solid #9cc7ff;color:#e8f3ff;font:600 17px Georgia,serif;padding:10px 26px;border-radius:24px}
.ico{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;background:#1f4f8f;border:2px solid #9cc7ff;border-radius:50%;width:44px;height:44px;font-size:20px;color:#fff}
.bar{margin-top:10px;width:78%;max-width:320px;background:linear-gradient(#2b66b3,#163a6b);border:3px solid #9cc7ff;border-radius:10px;text-align:center;font-size:22px;padding:8px;color:#e8f3ff;letter-spacing:1px}
#back{position:absolute;left:14px;top:10px;background:#1f4f8f;border:2px solid #9cc7ff;border-radius:50%;width:44px;height:44px;font-size:20px;color:#fff;z-index:3}
#mus2{position:absolute;right:14px;top:10px;background:#1f4f8f;border:2px solid #9cc7ff;border-radius:50%;width:44px;height:44px;font-size:20px;color:#fff;z-index:3}
#board{flex:1;width:100%;position:relative}
#bd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.t{position:absolute;width:var(--tw);height:calc(var(--tw)*1.22);border-radius:calc(var(--tw)*.14);background:linear-gradient(#fffdf4,#efe8d2);box-shadow:0 calc(var(--tw)*.08) 0 #1d5ea8,0 calc(var(--tw)*.11) calc(var(--tw)*.1) rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--tw)*.62);font-weight:700;line-height:1.02;color:#222;transition:filter .2s,transform .15s}
.t.blocked{filter:brightness(.74)}
.t.sel{outline:3px solid #ffd54a;transform:translateY(-4px)}
.t.hint{animation:pl .5s 3}
.t.gone{animation:gone .35s forwards;pointer-events:none}
@keyframes pl{50%{transform:scale(1.12);outline:3px solid #fff}}
@keyframes gone{to{transform:scale(1.4) rotate(8deg);opacity:0}}
.r{color:#c0392b}.gr{color:#1f8a5b}.m{color:#222;font-size:.8em}
.g{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:6%;width:72%;height:78%}
.g s{width:26%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.g u{width:20%;height:26%;border-radius:3px;background:linear-gradient(90deg,#1f8a5b,#5cc08f,#1f8a5b)}
.tools{display:flex;gap:10px;padding:10px 12px 18px}
.tools button{background:linear-gradient(#2b66b3,#163a6b);border:2px solid #9cc7ff;color:#e8f3ff;font:600 16px Georgia,serif;padding:10px 16px;border-radius:22px}
#lv{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px;width:100%;max-width:420px;overflow:auto;align-content:start}
#lv button{aspect-ratio:1;border-radius:14px;border:2px solid #9cc7ff;background:#1f4f8f;color:#e8f3ff;font:700 20px Georgia,serif}
#lv button:disabled{opacity:.35}
#lv button.cur{background:#e8641a}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9}
#modal.on{display:flex}
.card{background:linear-gradient(#eaf5ff,#bcdcf7);color:#123a66;border:4px solid #9cc7ff;border-radius:22px;padding:26px 24px;width:84%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.card h2{margin:0;font-size:26px}.card p{margin:0;font-size:20px;font-style:italic;line-height:1.35}
#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 16px;border-radius:16px;display:none;z-index:5;font-size:15px}
.petal{position:absolute;top:-30px;width:12px;height:16px;background:#ffb3c7;border-radius:80% 0 80% 0;opacity:.8;animation:fall linear infinite;pointer-events:none;z-index:1}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
#tray{display:flex;gap:6px;padding:8px 10px;margin-top:10px;background:linear-gradient(#2b66b3,#163a6b);border:3px solid #9cc7ff;border-radius:14px;box-shadow:inset 0 3px 8px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.3);z-index:2}
.sl{width:56px;height:68px;border-radius:8px;background:rgba(0,0,0,.3);box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.tt{width:100%;height:100%;border-radius:8px;background:linear-gradient(#fffdf4,#efe8d2);box-shadow:0 4px 0 #1d5ea8;display:flex;align-items:center;justify-content:center;font-size:35px;color:#222}
.sl.pop .tt{animation:gone .38s forwards}
.bu{position:fixed;z-index:60;font-size:22px;pointer-events:none;animation:bu .9s ease-out forwards}
@keyframes bu{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(200deg);opacity:0}}
#logo{width:min(80vw,44vh);border-radius:30px;box-shadow:0 10px 30px rgba(10,47,92,.5);animation:fl 3s ease-in-out infinite;position:relative;z-index:2}
@keyframes fl{50%{transform:translateY(-8px)}}
.bar small{font-size:14px;opacity:.8}

  <div id="modal"><div class="card"><h2 id="mh">¡Nivel completado!</h2><div id="st" style="font-size:34px"></div><p id="mp"></p><button class="big" id="next" style="font-size:22px;padding:12px 36px">Siguiente</button></div></div>
</div>

<script>
// ====== PERSONALIZA AQUÍ ======
const NAME = "Valentina";
const MSGS = ["Cada nivel contigo es un regalo, {n} 💙", "Eres mi jugada favorita, {n} 💗", "Contigo todo encaja, hasta las fichas 🧩", "Qué orgullo verte jugar así, {n} 🌸", "Tu sonrisa es mi nivel favorito 💙", "Si fueras una ficha, siempre te elegiría a ti 🦆", "Gracias por hacerme tan feliz, {n} 💜", "Eres lo más bonito de mis días 🌷", "Cada día contigo es un nivel superado 💫", "{n}, contigo el mundo se ve más bonito 🌻", "Eres mi pareja perfecta, como estas fichas 💘", "Te quiero muchísimo, {n} 💌", "Me encanta compartir mi vida contigo 💙", "Eres mi patito favorito del mundo 🦆💛", "Qué lista eres, {n}, ¡siempre lo logras! ⭐", "Estoy muy orgulloso de ti 🌸", "Tu felicidad es mi mejor premio 💗", "Contigo todo es mejor 🧸", "Eres mi lugar favorito, {n} 💙", "Un nivel más, un motivo más para quererte 💍", "Eres increíble, {n}, no lo olvides 🌺", "Gracias por existir, mi amor 💐", "Mi corazón siempre te elige a ti 💜", "Eres mi casualidad más bonita 🌹"];
// Para agregar niveles en una actualización, añade objetos aquí:
// {seed:1234, R:9, C:8, layers:4, k:34, hole:.12}
const MORE_LEVELS = [];
// ==============================
const TOTAL = () => 200 + MORE_LEVELS.length;
const $ = s => document.querySelector(s);
let prog = 1, mus = true;
try { prog = +localStorage.getItem('mj-prog') || 1; mus = localStorage.getItem('mj-mus') !== '0'; } catch (e) {}
const save = () => { try { localStorage.setItem('mj-prog', prog); localStorage.setItem('mj-mus', mus ? 1 : 0); } catch (e) {} };
const rngf = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const EM=['🦆','💗','🌸','🌷','💌','🌺','💜','🌻','🍑','🧸','💘','💐','🌹','🍫','💍'];
const DUCK='<svg viewBox="0 0 64 64" width="1.05em" height="1.05em" style="display:block"><g stroke="#e0a000" stroke-width="1.5"><path d="M50 38q10-6 8-14-8 3-12 10z" fill="#ffd23f"/><ellipse cx="32" cy="43" rx="22" ry="15" fill="#ffd23f"/><ellipse cx="38" cy="45" rx="10" ry="7" fill="#ffc31f"/><circle cx="24" cy="25" r="14" fill="#ffd23f"/><path d="M25 11q2-6 7-3-4 0-4 4z" fill="#ffd23f"/></g><ellipse cx="11" cy="29" rx="7" ry="4" fill="#ff8a1f"/><circle cx="22" cy="22" r="3" fill="#222"/><circle cx="23" cy="21" r="1.1" fill="#fff"/><circle cx="17" cy="30" r="3" fill="#ff9fb0" opacity=".8"/></svg>';
const face=t=>t==0?DUCK:EM[t];
const K=(l,x,y)=>(l*100+x)*100+y;
const OFS=[[0,0],[1,1],[0,1],[1,0],[1,1],[0,1]];
function cfg(L){
  if(L>200)return Object.assign({hole:.1,k:15,layers:6,R:9,C:8,p:.8},MORE_LEVELS[L-201]);
  const t=.5+.5*(L-1)/199;
  return{seed:L*97+13,R:3+Math.round(6*Math.pow(t,.7)),C:4+Math.round(4*Math.min(1,t*1.6)),layers:Math.min(3+(L/50|0),6),k:Math.min(15,9+Math.ceil(L/15)),hole:.1,p:.55+.25*(L/200)};
}
const freeIn=(m,t)=>{
  for(let l=t.l+1;l<8;l++)for(let dx=-1;dx<2;dx++)for(let dy=-1;dy<2;dy++)if(m.has(K(l,t.x+dx,t.y+dy)))return false;
  const s=d=>{for(let dy=-1;dy<2;dy++)for(const e of d)if(m.has(K(t.l,t.x+e,t.y+dy)))return true;return false};
  return !s([-2,-1])||!s([1,2]);
};
function assign(T,pool,r){
  const m=new Map(T.map(t=>[t.k,t])),pl=pool.slice();
  while(m.size){
    const fr=[...m.values()].filter(t=>freeIn(m,t));
    if(fr.length<2)return false;
    const a=fr.splice(r()*fr.length|0,1)[0],b=fr.splice(r()*fr.length|0,1)[0];
    a.t=b.t=pl.pop();m.delete(a.k);m.delete(b.k);
  }
  return true;
}
function build(L){
  const f=cfg(L),r=rngf(f.seed),Wh=2*f.C,Hh=2*f.R,T=[],lay=[];
  const put=(l,x,y)=>{const t={l,x,y,k:K(l,x,y)};T.push(t);lay[l].set(t.k,t)};
  lay[0]=new Map();
  for(let y=0;y<Hh;y+=2)for(let x=0;x<Wh/2;x+=2)if(r()>=f.hole){put(0,x,y);if(Wh-2-x!=x)put(0,Wh-2-x,y)}
  for(let l=1;l<f.layers;l++){
    lay[l]=new Map();const[ox,oy]=OFS[l];
    for(let y=oy;y<=Hh-2;y+=2)for(let x=ox;x<=(Wh-2)/2;x+=2){
      let sup=false;
      for(let dx=-1;dx<2;dx++)for(let dy=-1;dy<2;dy++)if(lay[l-1].has(K(l-1,x+dx,y+dy)))sup=true;
      if(sup&&r()<f.p){put(l,x,y);if(Wh-2-x!=x)put(l,Wh-2-x,y)}
    }
  }
  if(T.length%2)T.pop();
  let n=0;
  for(;;){
    const pool=Array.from({length:T.length/2},()=>r()*f.k|0);
    if(assign(T,pool,r))break;
    if(++n%40==0){T.pop();T.pop()}
  }
  return{f,T};
}
// ---------- juego ----------
let G = null, tray = [], undoS = [], busy = false, used = 0;
const isFree = t => freeIn(G.alive, t);
const head = () => $('#ttl').innerHTML = 'Nivel ' + G.L + ' <small>· ' + (G.alive.size + tray.length) + ' fichas</small>';
function start(L) {
  const { f, T } = build(L); tray = []; undoS = []; busy = false; used = 0;
  G = { L, f, T, alive: new Map(T.map(t => [t.k, t])) };
  head(); renderTray(); show('game'); $('#modal').classList.remove('on');
  requestAnimationFrame(layout);
}
function renderTray() {
  $('#tray').innerHTML = [0, 1, 2, 3].map(i => '<div class="sl">' + (tray[i] ? '<div class="tt">' + face(tray[i].t) + '</div>' : '') + '</div>').join('');
}
function layout() {
  if (!G) return;
  const b = $('#board'), { R, C } = G.f;
  const tw = Math.min(b.clientWidth / (C + .4), b.clientHeight / ((R + .4) * 1.22 + .2), 66), th = tw * 1.22, off = tw * .08;
  const bd = $('#bd'); bd.style.cssText = `--tw:${tw}px;width:${C * tw}px;height:${R * th}px`;
  bd.innerHTML = '';
  G.T.forEach(t => {
    const e = document.createElement('div'); e.className = 't'; e.innerHTML = face(t.t);
    e.style.left = (t.x * tw / 2 - t.l * off) + 'px'; e.style.top = (t.y * th / 2 - t.l * off) + 'px'; e.style.zIndex = t.l * 10 + 1;
    e.onclick = () => tap(t); t.el = e; if (!G.alive.has(t.k)) e.style.visibility = 'hidden'; bd.appendChild(e);
  });
  paint();
}
function paint() { G.T.forEach(t => { if (G.alive.has(t.k)) t.el.classList.toggle('blocked', !isFree(t)); }); }
function tap(t) {
  if (busy || !G.alive.has(t.k) || !isFree(t)) return;
  busy = true; sfx(520 + t.l * 40, .08);
  G.alive.delete(t.k); undoS.push(t);
  const sl = $('#tray').children[tray.length], a = t.el.getBoundingClientRect(), b = sl.getBoundingClientRect();
  const c = t.el.cloneNode(true);
  c.style.cssText = `position:fixed;left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;margin:0;z-index:50;--tw:${a.width}px;transition:all .28s cubic-bezier(.3,.8,.4,1)`;
  document.body.appendChild(c); t.el.style.visibility = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(() => { c.style.left = b.left + 'px'; c.style.top = b.top + 'px'; c.style.width = b.width + 'px'; c.style.height = b.height + 'px'; c.style.setProperty('--tw', b.width + 'px'); }));
  paint();
  setTimeout(() => {
    c.remove(); tray.push(t); renderTray(); head();
    const m = tray.find(x => x != t && x.t == t.t);
    if (m) {
      [...$('#tray').children].forEach((s, i) => { if (tray[i] == t || tray[i] == m) s.classList.add('pop'); });
      sfx(880, .25); sfx(1175, .35, .08); burst();
      setTimeout(() => { tray = tray.filter(x => x != t && x != m); renderTray(); busy = false; head(); if (!G.alive.size && !tray.length) win(); }, 380);
    } else if (tray.length >= 4) lose(); else busy = false;
  }, 300);
}
function burst() {
  const r = $('#tray').getBoundingClientRect();
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span'); s.className = 'bu'; s.textContent = ['💗', '🌸', '✨', '💜', '🦆'][i % 5];
    s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + r.height / 2) + 'px';
    s.style.setProperty('--dx', (Math.random() * 260 - 130) + 'px'); s.style.setProperty('--dy', (Math.random() * 220 - 60) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 900);
  }
}
function modal(h, p, st, bt, fn) {
  $('#mh').textContent = h; $('#mp').textContent = p; $('#st').textContent = st; $('#next').textContent = bt; $('#next').onclick = fn; $('#modal').classList.add('on');
}
function win() {
  if (G.L == prog && prog < TOTAL()) { prog++; save(); }
  const last = G.L >= TOTAL(), st = used == 0 ? '⭐⭐⭐' : used < 4 ? '⭐⭐' : '⭐';
  modal('¡Nivel ' + G.L + ' completado!', last ? '¡Terminaste todos, ' + NAME + '! Pronto habrá más niveles 💚' : MSGS[(G.L - 1) % MSGS.length].replace('{n}', NAME), st, last ? 'Inicio' : 'Siguiente', () => last ? home() : start(G.L + 1));
  sfx(660, .6); sfx(880, .6, .15); sfx(1320, .8, .3);
}
function lose() {
  sfx(330, .5); sfx(262, .7, .2);
  modal('¡Se llenó la bandeja!', 'No pasa nada, ' + NAME + ', ¡inténtalo otra vez! 💙', '💔', 'Reiniciar', () => start(G.L));
}
$('#hint').onclick = () => {
  if (busy) return; used++;
  const free = [...G.alive.values()].filter(isFree); let h = [];
  for (const x of tray) { const m = free.find(f => f.t == x.t); if (m) { h = [m]; break; } }
  if (!h.length) for (let i = 0; i < free.length && !h.length; i++) for (let j = i + 1; j < free.length; j++) if (free[i].t == free[j].t) { h = [free[i], free[j]]; break; }
  if (!h.length) h = free.slice(0, 1);
  h.forEach(x => { x.el.classList.add('hint'); setTimeout(() => x.el.classList.remove('hint'), 1600); });
};
$('#undo').onclick = () => {
  const t = undoS[undoS.length - 1]; if (busy || !t || !tray.includes(t)) return;
  undoS.pop(); tray = tray.filter(x => x != t); G.alive.set(t.k, t); t.el.style.visibility = ''; used++; renderTray(); paint(); head();
};
// ---------- pantallas ----------
function show(id) { document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id == id)); }
function home() { G = null; $('#play').textContent = 'Nivel ' + Math.min(prog, TOTAL()); show('home'); }
function levels() {
  const lv = $('#lv'); lv.innerHTML = '';
  for (let i = 1; i <= TOTAL(); i++) { const b = document.createElement('button'); b.textContent = i; b.disabled = i > prog; if (i == prog) b.className = 'cur'; b.onclick = () => start(i); lv.appendChild(b); }
  show('levels');
}
$('#hi').textContent = 'Un juego hecho solo para ti, ' + NAME + ' 💚';
$('#play').onclick = () => { audioOn(); start(Math.min(prog, TOTAL())); };
$('#lvbtn').onclick = () => { audioOn(); levels(); };
$('#lback').onclick = home; $('#back').onclick = home;
window.addEventListener('resize', layout);
// ---------- petalos ----------
for (let i = 0; i < 12; i++) { const p = document.createElement('div'); p.className = 'petal'; p.style.left = Math.random() * 100 + 'vw'; p.style.animationDuration = 9 + Math.random() * 9 + 's'; p.style.animationDelay = -Math.random() * 12 + 's'; document.body.appendChild(p); }
// ---------- audio (generado, sin archivos) ----------
let AC, mg, started = false;
function note(f, dur, vol, att, delay) {
  if (!AC) return; const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(mg); o.start(t); o.stop(t + dur + .1);
}
function sfx(f, d, delay) { note(f, d + .3, .18, .005, delay); }
function audioOn() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)(); mg = AC.createGain();
    const d = AC.createDelay(); d.delayTime.value = .42; const fb = AC.createGain(); fb.gain.value = .5; const lp = AC.createBiquadFilter(); lp.frequency.value = 1800;
    mg.connect(AC.destination); mg.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(AC.destination);
    const P = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3], R = [130.8, 110, 87.3, 98]; let n = 0;
    setInterval(() => {
      if (!mus) return;
      if (n % 4 == 0) { const r = R[(n / 4) % 4]; [1, 1.5, 2, 2.5].forEach((m, i) => note(r * m, 8, .05, 2.5, i * .1)); }
      note(P[Math.random() * P.length | 0], 3.5, .07, .1); if (Math.random() < .5) note(P[Math.random() * P.length | 0], 3, .05, .1, .9); n++;
    }, 1900);
  }
  AC.resume(); mg.gain.setTargetAtTime(mus ? 1 : 0, AC.currentTime, .2);
}
function togMus() { mus = !mus; save(); audioOn(); $('#mus').textContent = $('#mus2').textContent = mus ? '🎵' : '🔇'; }
$('#mus').onclick = $('#mus2').onclick = togMus;
$('#mus').textContent = $('#mus2').textContent = mus ? '🎵' : '🔇';
home();
</script></body></html>
